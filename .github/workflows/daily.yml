name: 每日蟲害新聞更新
on:
  schedule:
    - cron: "17 */2 * * *"   # 每2小時第17分鐘（香港時間 00:17、02:17、04:17…）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 抓取、過濾、去重、分類、摘要
        env:
          REVIEW_MEDIA: "false"   # 改 "true" 則媒體報道先入草稿待審批
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pipeline.run
      - name: 提交更新資料
        run: |
          git config user.name "pest-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Hong_Kong date '+%F %H:%M') 更新"
          git pull --rebase
          git push
